name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: pakcipher-windows-x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: pakcipher-linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: pakcipher-linux-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: pakcipher-macos-x64
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: pakcipher-macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
          rustup target add ${{ matrix.target }} --toolchain stable
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev libx11-dev
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test
        run: cargo +stable test --locked --workspace --release --target ${{ matrix.target }}
      - name: Build release binaries
        run: cargo +stable build --locked --workspace --release --target ${{ matrix.target }}
      - name: Package Linux binaries
        if: runner.os == 'Linux'
        run: tar -czf "$ARTIFACT.tar.gz" -C "target/$TARGET/release" pakcipher pakcipher-gui
      - name: Package macOS app and CLI
        if: runner.os == 'macOS'
        run: bash scripts/package-macos.sh "target/$TARGET/release" "$ARTIFACT.tar.gz"
      - name: Upload Windows binaries
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/${{ matrix.target }}/release/pakcipher.exe
            target/${{ matrix.target }}/release/pakcipher-gui.exe
          if-no-files-found: error
      - name: Upload Linux or macOS package
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
